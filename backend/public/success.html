<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Submitted</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --background: #09090b;
      --card: #18181b;
      --border: #27272a;
      --emerald: #10b981;
      --foreground: #f4f4f5;
      --muted-foreground: #a1a1aa;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background-color: var(--background);
      color: var(--foreground);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* Ambient glow */
    body::before {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, rgba(0,0,0,0) 70%);
      top: 20%;
      left: 20%;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 420px;
      z-index: 1;
    }

    .card {
      background-color: rgba(24, 24, 27, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .success-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      background: rgba(16, 185, 129, 0.1);
      border: 2px solid var(--emerald);
      border-radius: 50%;
      margin-bottom: 24px;
      color: var(--emerald);
      font-size: 28px;
      font-weight: bold;
      animation: scaleUp 0.4s ease-out;
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      color: var(--foreground);
    }

    .message {
      font-size: 15px;
      color: var(--muted-foreground);
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .badge {
      display: inline-block;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      color: var(--emerald);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 24px;
    }

    .close-hint {
      font-size: 12px;
      color: var(--muted-foreground);
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }

    @keyframes scaleUp {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <div class="success-icon">✓</div>
      <div class="badge">Check-in Verified</div>
      <h1>Attendance Logged</h1>
      <p class="message">Your attendance has been recorded successfully. You are now marked as present for this class session.</p>
      
      <p class="close-hint">You may now safely close this browser window.</p>
    </div>
  </div>

</body>
</html>
