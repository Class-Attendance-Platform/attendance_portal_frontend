<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HSTU Attendance Portal</title>
  <style>
    /* Campus Green tokens (light only), as in the app's global.css. */
    :root { color-scheme: light; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; line-height: 22px;
      background: #F5F7F5; color: #17201A;
    }
    .card {
      max-width: 360px; margin: 16px; padding: 24px; text-align: center;
      background: #FFFFFF; border: 1px solid #DCE3DD; border-radius: 10px;
    }
    h1 { margin: 0 0 8px; font-size: 20px; line-height: 26px; }
    p { margin: 0 0 20px; color: #525E55; }
    button {
      min-height: 44px; padding: 0 16px; border: 1px solid #0A6B3B; border-radius: 8px; cursor: pointer;
      background: #0A6B3B; color: #FFFFFF; font: inherit; font-weight: 600;
    }
    button:hover { background: #08552F; border-color: #08552F; }
    button:focus-visible { outline: 2px solid #0A6B3B; outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Can't reach the portal</h1>
    <p>Check your internet connection, then try again.</p>
    <button id="retry" autofocus>Try again</button>
  </div>
  <script>
    const target = new URLSearchParams(location.search).get('url');
    document.getElementById('retry').addEventListener('click', () => {
      if (target) location.href = target;
    });
  </script>
</body>
</html>
