<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Class Attendance Portal</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #fafafa; color: #0a0a0a;
    }
    .card {
      max-width: 360px; margin: 16px; padding: 28px; text-align: center;
      background: #ffffff; border: 1px solid #e5e5e5; border-radius: 16px;
    }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { margin: 0 0 20px; font-size: 14px; line-height: 20px; color: #525252; }
    button {
      height: 44px; padding: 0 20px; border: none; border-radius: 10px; cursor: pointer;
      background: #171717; color: #fafafa; font: inherit; font-weight: 600;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0a0a0a; color: #fafafa; }
      .card { background: #171717; border-color: #262626; }
      p { color: #a3a3a3; }
      button { background: #fafafa; color: #171717; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Can't reach the portal</h1>
    <p>Check your internet connection, then try again.</p>
    <button id="retry" autofocus>Try again</button>
  </div>
  <script>
    const target = new URLSearchParams(location.search).get('url');
    document.getElementById('retry').addEventListener('click', () => {
      if (target) location.href = target;
    });
  </script>
</body>
</html>
