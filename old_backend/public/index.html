<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HSTU Attendance Submission</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --background: #09090b;
      --card: #18181b;
      --border: #27272a;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --foreground: #f4f4f5;
      --muted-foreground: #a1a1aa;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background-color: var(--background);
      color: var(--foreground);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* Ambient background glow */
    body::before {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, rgba(0,0,0,0) 70%);
      top: 10%;
      left: 10%;
      z-index: 0;
    }

    body::after {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(147, 51, 234, 0.1) 0%, rgba(0,0,0,0) 70%);
      bottom: 10%;
      right: 10%;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 420px;
      z-index: 1;
    }

    .card {
      background-color: rgba(24, 24, 27, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 16px;
      margin-bottom: 24px;
      font-size: 24px;
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    h1 span {
      background: linear-gradient(to right, #3b82f6, #9333ea);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 14px;
      color: var(--muted-foreground);
      margin-bottom: 32px;
      line-height: 1.5;
    }

    .form-group {
      text-align: left;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted-foreground);
      margin-bottom: 8px;
      padding-left: 4px;
    }

    input {
      width: 100%;
      background-color: rgba(9, 9, 11, 0.5);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 16px;
      color: var(--foreground);
      outline: none;
      transition: all 0.25s ease;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
      background-color: rgba(9, 9, 11, 0.8);
    }

    button {
      width: 100%;
      background: linear-gradient(135deg, var(--primary) 0%, #4f46e5 100%);
      color: white;
      border: none;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.35);
      filter: brightness(1.05);
    }

    button:active {
      transform: translateY(0);
    }

    .footer {
      margin-top: 24px;
      font-size: 11px;
      color: var(--muted-foreground);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <div class="logo-badge">🎓</div>
      <h1>HSTU <span>Attendance</span></h1>
      <p class="subtitle">Enter your registered Student ID to submit your attendance for this active session.</p>
      
      <form id="submission-form" method="POST" action="/submit">
        <div class="form-group">
          <label for="student_id">Student ID Number</label>
          <input 
            type="number" 
            id="student_id" 
            name="student_id" 
            placeholder="e.g. 2302001" 
            required 
            min="1000000" 
            max="9999999"
            inputmode="numeric"
          >
        </div>
        
        <button type="submit">Verify & Submit Present</button>
      </form>
      
      <p class="footer">HSTU Attendance Portal &copy; 2026. All rights reserved.</p>
    </div>
  </div>

</body>
</html>
