# Type check, unit tests and production web build on every pull request.
name: Checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p .

      - name: Unit tests
        run: npm test

      - name: Production web build
        run: npm run build:web
